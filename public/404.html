<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Shivam Florist</title>
    <script>
      // SPA deep-link fallback: remember the requested path, boot the app from
      // the root, then let React Router restore the original route (issue #1).
      try {
        sessionStorage.setItem(
          "spa_redirect",
          location.pathname + location.search + location.hash
        );
      } catch (e) {}
      location.replace("/");
    </script>
  </head>
  <body></body>
</html>
